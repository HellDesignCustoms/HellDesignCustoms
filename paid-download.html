<script>
// Generate a daily access code based on today's date
function generateDailyCode() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1; // 1-12
    const day = today.getDate(); // 1-31

    // Create a unique daily code (example: 20260728 → 728)
    const rawCode = `${year}${month}${day}`;

    // Convert to a 4-digit code by hashing the date
    let hash = 0;
    for (let i = 0; i < rawCode.length; i++) {
        hash = (hash * 31 + rawCode.charCodeAt(i)) % 10000;
    }

    // Ensure it's always 4 digits
    return hash.toString().padStart(4, "0");
}

const correctCode = generateDailyCode();

// Show the code in the console so YOU can see it
console.log("Today's access code:", correctCode);

// Check user input
function checkCode() {
    const userCode = document.getElementById("codeInput").value;

    if (userCode === correctCode) {
        document.getElementById("downloadSection").style.display = "block";
    } else {
        alert("Invalid code. Please check your payment confirmation.");
    }
}
</script>
